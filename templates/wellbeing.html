<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3eb">
  <title>My Wellbeing - SAATHI</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-shell">
  <header class="site-header dashboard-header">
    <a class="brand" href="{{ url_for('home') }}" aria-label="SAATHI home">
      <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
      <span>saathi<span class="brand-period">.</span></span>
    </a>
    <nav class="top-nav dashboard-nav" aria-label="Main navigation">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('chat') }}">Chat</a>
      <a href="{{ url_for('check_in_page') }}">Check-in</a>
      <a href="{{ url_for('profile_view') }}">Profile</a>
    </nav>
  </header>

  <main class="page-main compact-main">
    <section class="simple-panel">
      <p class="eyebrow">My Wellbeing</p>
      <h1>Recent check-ins</h1>

      {% if check_ins %}
      <div class="timeline">
        {% for item in check_ins %}
        <div class="timeline-item">
          <div class="timeline-date">{{ item.date_label }}</div>
          <div class="timeline-badge">{{ item.label }}</div>
          {% if item.note %}
          <p>{{ item.note }}</p>
          {% endif %}
        </div>
        {% endfor %}
      </div>
      {% else %}
      <div class="empty-state">No check-ins yet. Start by making a daily check-in.</div>
      {% endif %}
    </section>
  </main>
</body>
</html>
